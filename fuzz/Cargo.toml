[package]
name = "jnt-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone on purpose: fuzzing pulls its own profile and toolchain
# (nightly, sanitizer flags), which must never leak into the node's build.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.jnt-core]
path = "../crates/jnt-core"

[dependencies.jnt-l2]
path = "../crates/jnt-l2"

[dependencies.jnt-store]
path = "../crates/jnt-store"

[dependencies.jnt-net]
path = "../crates/jnt-net"

[dependencies.jnt-worker]
path = "../crates/jnt-worker"

# Avoid the fuzz binary inheriting the workspace's panic="abort" release
# profile, which is incompatible with libFuzzer's crash handlers.
[profile.release]
panic = "unwind"
codegen-units = 1

[[bin]]
name = "tx_decode"
path = "fuzz_targets/tx_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_decode"
path = "fuzz_targets/block_decode.rs"
