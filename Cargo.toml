[workspace]
resolver = "2"
members = ["crates/jnt-core", "crates/jnt-l2", "crates/jnt-mcp", "crates/jnt-net", "crates/jnt-node", "crates/jnt-store", "crates/jnt-worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Swamy Gadila"]
license = "MIT"
repository = "https://github.com/swamy18/Jounit"
description = "Jounit: an AI-native cryptocurrency whose mining does real work on AI hardware."

[workspace.dependencies]
jnt-core = { path = "crates/jnt-core" }
jnt-l2 = { path = "crates/jnt-l2" }
jnt-net = { path = "crates/jnt-net" }
jnt-store = { path = "crates/jnt-store" }
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
blst = "0.3"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
# Wallet-file at-rest protection (jnt-node): Argon2id KDF + ChaCha20-Poly1305.
argon2 = "0.5"
chacha20poly1305 = "0.10"
# Zeroizing in-memory key material (jnt-node wallet_store) so decrypted keys and
# derived symmetric keys do not linger in freed memory.
zeroize = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true