[workspace]
resolver = "2"
members = ["crates/srct-core", "crates/srct-l2", "crates/srct-mcp", "crates/srct-miner", "crates/srct-net", "crates/srct-node", "crates/srct-store", "crates/srct-worker", "crates/srct-policy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Swamy Gadila"]
license = "MIT"
repository = "https://github.com/swamy18/Solar-Cyber-Unit"
description = "Solar Cyber Unit: an AI-native cryptocurrency whose mining does real work on AI hardware."

[workspace.dependencies]
srct-core = { path = "crates/srct-core" }
srct-l2 = { path = "crates/srct-l2" }
srct-net = { path = "crates/srct-net" }
srct-store = { path = "crates/srct-store" }
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
blst = "0.3"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
# Wallet-file at-rest protection (srct-node): Argon2id KDF + ChaCha20-Poly1305.
argon2 = "0.5"
chacha20poly1305 = "0.10"
# Zeroizing in-memory key material (srct-node wallet_store) so decrypted keys and
# derived symmetric keys do not linger in freed memory.
zeroize = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true