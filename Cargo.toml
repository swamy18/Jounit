[workspace]
resolver = "2"
members = ["crates/jnt-core", "crates/jnt-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jounit-network/jounit"

[workspace.dependencies]
jnt-core = { path = "crates/jnt-core" }
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"