# Keeps dependencies current without turning the branch list into noise.
#
# Two rules shape this file, both learned from what earlier revisions did:
# the first set `open-pull-requests-limit: 5` per ecosystem with no grouping,
# which produced eleven simultaneous PRs (five crate bumps and six action bumps)
# the day it landed. Dependabot opens one branch per *dependency*, so a repo
# that wants a single `main` branch must not let it open any at all.
version: 2
updates:
  # Rust crates. Grouped, then capped at zero open PRs.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
      include: "scope"
    # Every crate into a single PR (if any PR were allowed at all).
    groups:
      rust-crates:
        patterns:
          - "*"
    # Zero, deliberately: this repo keeps `main` as its only branch, and every
    # Dependabot version PR *is* a branch. Security visibility is not disabled
    # by this — GitHub's Dependabot alerts in the Security tab are driven by the
    # advisory database and `Cargo.lock`, not by these PRs — but the automated
    # bump is, so applying one becomes `cargo update -p <crate>` plus `cargo
    # audit` as an owner step (see `docs/mainnet-readiness.md` §1).
    open-pull-requests-limit: 0
    # A semver-major bump of these is a *protocol* decision, not a bot's.
    # `sha2` is the domain separator every hash on the chain flows through,
    # `k256` is the curve every signature is verified on, and `argon2` /
    # `chacha20poly1305` are the wallet's KDF and cipher. Swapping any of them
    # on a major can change encoded forms or verification behaviour, so it must
    # be a deliberate, tested release. Ignoring them here blocks the *major*
    # only: patch and minor security releases still arrive, which is what keeps
    # a CVE in, say, `sha2 0.10.x` moving.
    ignore:
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "k256"
        update-types: ["version-update:semver-major"]
      - dependency-name: "argon2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chacha20poly1305"
        update-types: ["version-update:semver-major"]

  # GitHub Actions. Zero-PR and zero-branch for the same reason *plus* a
  # correctness one: `dtolnay/rust-toolchain` is pinned to the moving `stable`
  # and `nightly` branches by SHA, and the updater resolves both to the same
  # latest tip and then rewrites one with the other's SHA — it opened a PR
  # proposing to change the `# nightly` pin to `stable`'s SHA. No pin it writes
  # for that action can be trusted. Every action pin is a manual
  # release-checklist step: resolve the SHA back to its tag and check it against
  # the branch it was cut from (`docs/mainnet-readiness.md` §1).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 0
    # `dtolnay/rust-toolchain` is the one action Dependabot cannot help with.
    # The workflows pin `stable` and `nightly` — moving *branches*, not tags —
    # by SHA. The updater resolves both pins to the same latest tip and then
    # rewrites one of them with the other's SHA: it opened a PR proposing to
    # change the `# nightly` pin to the SHA that is `stable`'s tip. No pin it
    # writes for this action can be trusted, so it is ignored and the toolchain
    # pins are refreshed by hand as part of the release checklist
    # (`docs/mainnet-readiness.md` §1).
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
