name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here needs to write anything, so the default `GITHUB_TOKEN`
# scope is read-only for the whole workflow rather than granted per job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # The puzzle tests are deliberately slow: NN weights are re-derived
        # from the hash chain on some paths, and the retarget vector test walks
        # 60-block windows. Do not shorten the timeout to hide a regression.
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --workspace --release

  vectors:
    name: vectors and cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Verify vector files are present and cross-checked
        # Runs the Rust vector tests first (to prove the committed files match
        # the current implementation), then the independent Python reference
        # against them. A disagreement here is a spec ambiguity, not a
        # formatting difference -- see SPEC.md section 12.
        run: |
          cargo test -p srct-core --lib vectors
          python sim/puzzle_crosscheck.py
          python sim/verify_vectors.py --check
          python sim/l2_authority_reference.py --check
          python sim/check_fuzz_targets.py

      - name: Difficulty attack containment
        # Guards the claim in SPEC.md 6.1: the future-timestamp allowance
        # must not let a minority attacker speed up the chain.
        run: python sim/difficulty_attack_sim.py

      - name: Supply cross-check against design doc
        run: python sim/supply_schedule_sim.py

  fuzz-smoke:
    name: fuzz smoke (nightly + ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Nightly with llvm-tools/clang runtime is what cargo-fuzz builds with;
      # on Linux the ASan runtime ships with the toolchain, so no extra setup.
      # Pinned by SHA from the branch tip, and deliberately NOT maintained by
      # Dependabot (its github-actions updater resolves moving branches to the
      # wrong SHA — see `.github/dependabot.yml`). Refreshed by hand.
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz

      - name: Smoke-run each target
        # Short budget per target: CI proves the harness builds, runs, and
        # survives a seedless start plus the committed corpus without finding
        # a crash. Long campaigns run locally (see docs/status.md) and any
        # minimized crash lands here as a regression test.
        #
        # The list is every registered target in fuzz/Cargo.toml - a target
        # that exists but is not in this loop is a target nobody ever runs, so
        # `deliverable_codec` (registered but previously forgotten) and the
        # two authority/credit harnesses are here. The budget per target is
        # deliberately small: the loop is a smoke test, not a campaign.
        run: |
          for t in tx_decode block_decode wire_msg_decode mempool_admit storage_recover checkpoint_validate meta_parse l2_payload_decode m3_readers dispute_arbitrate l2_state_apply vwc_decode worker_flows checkpoint_codec deliverable_codec l2_policy_apply l2_credit_apply; do
            cargo fuzz run "$t" -- -max_total_time=20 -rss_limit_mb=4096
          done
        working-directory: fuzz
