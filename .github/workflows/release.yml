name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild artifacts for"
        required: true
        type: string

# Least privilege by default: every job starts read-only and each takes only the
# extra scope it needs. `gate` verifies the tree and needs nothing beyond read;
# `build` needs `id-token: write` for the keyless cosign OIDC identity; `publish`
# needs `contents: write` to create the release. No job pushes to GHCR, so
# `packages: write` is deliberately absent.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate `ci.yml` runs, on the same commit the tag points at, so a
  # release cannot be built from a tree that would not pass CI. This is the
  # "run all tests, fix failures" step of the release checklist in
  # `docs/mainnet-readiness.md` §7, made non-optional.
  gate:
    name: verify the tagged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Release artifacts are what operators run, so the artifact build is
      # itself part of the gate rather than something the build job discovers.
      - name: Release build
        run: cargo build --workspace --release

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Keyless signing below mints an ephemeral cosign key pair from the run's
      # OIDC identity, so the job must be able to request one.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jnt-node
            miner: jnt-miner
            # Uniquely named per-platform archive: the linux and macOS jobs
            # both build files named `jnt-node`/`jnt-miner`, so publishing
            # bare files collides. One archive per target keeps every
            # platform's files separate by construction.
            package: jounit-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: jnt-node
            miner: jnt-miner
            package: jounit-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: jnt-node.exe
            miner: jnt-miner.exe
            package: jounit-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p jnt-node -p jnt-miner

      - name: Checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          artifacts=("${{ matrix.artifact }}" "${{ matrix.miner }}")
          : > SHA256SUMS
          for a in "${artifacts[@]}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$a" | sed 's#  *#  #' >> SHA256SUMS
            else
              # macOS ships shasum rather than sha256sum; the format is identical.
              shasum -a 256 "$a" | sed 's#  *#  #' >> SHA256SUMS
            fi
          done
          cat SHA256SUMS

      # Keyless signing (cosign/OIDC). No long-lived private key is stored in
      # the repo or its secrets: cosign mints an ephemeral key pair from the
      # GitHub OIDC identity and uploads the attestation to the Sigstore
      # transparency log. `mainnet-readiness.md` §7: operators verify against
      # the SHA256SUMS + the Sigstore bundle, not a Jounit-held signing key.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-version: '3.1.3'

      - name: Sign binaries
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          for a in "${{ matrix.artifact }}" "${{ matrix.miner }}"; do
            cosign sign-blob --bundle "$a.sig" --yes "$a"
          done

      # One self-contained archive per platform: binaries, their Sigstore
      # bundles and the per-platform SHA256SUMS travel together under a
      # name that is unique across the matrix, so no platform can
      # overwrite another's files at download or release time.
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          stage="pkg-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "${{ matrix.artifact }}" "${{ matrix.miner }}" SHA256SUMS \
             "${{ matrix.artifact }}.sig" "${{ matrix.miner }}.sig" "$stage/"
          if [[ "${{ matrix.package }}" == *.zip ]]; then
            python3 -c "
          import zipfile, os
          stage = os.environ.get('STAGE', '$stage')
          out = '${{ matrix.package }}'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(os.listdir(stage)):
                  z.write(os.path.join(stage, f), f)
          "
          else
            tar -czf "${{ matrix.package }}" -C "$stage" .
          fi
          ls -la "${{ matrix.package }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jnt-node-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.package }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release is the only write this job performs.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Archive names are unique per target (`jounit-<target>.tar.gz/.zip`),
      # so a flat merge is collision-free: each artifact contributes exactly
      # one distinctly named file.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Assets
        shell: bash
        run: |
          cd dist
          # One combined manifest over the archives themselves, generated
          # only after all platforms are downloaded, so the release carries
          # a single checksum file covering every platform exactly once.
          : > SHA256SUMS
          for a in jounit-*.tar.gz jounit-*.zip; do
            [ -e "$a" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$a" | sed 's#  *#  #' >> SHA256SUMS
            else
              shasum -a 256 "$a" | sed 's#  *#  #' >> SHA256SUMS
            fi
          done
          cat SHA256SUMS
          {
            echo 'Release artifacts are signed keyless with cosign (OIDC identity)'
            echo 'from this GitHub Actions run — no long-lived signing key is stored'
            echo 'in the repository. See docs/mainnet-readiness.md §7.'
            echo
            echo 'Each platform ships as one archive (binaries + .sig bundles +'
            echo 'per-platform SHA256SUMS inside):'
            echo '  jounit-x86_64-unknown-linux-gnu.tar.gz'
            echo '  jounit-aarch64-apple-darwin.tar.gz'
            echo '  jounit-x86_64-pc-windows-msvc.zip'
            echo
            echo 'Verification:'
            echo
            echo '  1. Fetch the archive for your platform and unpack it.'
            echo '  2. Verify the archive checksum:'
            echo '       sha256sum -c SHA256SUMS   (matching entry)'
            echo '  3. Inside the unpacked directory, verify the binaries:'
            echo '       sha256sum -c SHA256SUMS'
            echo '  4. Verify the sigstore bundles (cosign 2.x):'
            echo '       cosign verify-blob --bundle <binary>.sig <binary>'
            echo
            echo 'Checksums (archives):'
            cat SHA256SUMS
          } > VERIFICATION.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/jounit-*.tar.gz
            dist/jounit-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: dist/VERIFICATION.txt
