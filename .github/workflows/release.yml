name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild artifacts for"
        required: true
        type: string

# Least privilege by default: every job starts read-only and each takes only the
# extra scope it needs. `gate` verifies the tree and needs nothing beyond read;
# `build` needs `id-token: write` for the keyless cosign OIDC identity; `publish`
# needs `contents: write` to create the release. No job pushes to GHCR, so
# `packages: write` is deliberately absent.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate `ci.yml` runs, on the same commit the tag points at, so a
  # release cannot be built from a tree that would not pass CI. This is the
  # "run all tests, fix failures" step of the release checklist in
  # `docs/mainnet-readiness.md` §7, made non-optional.
  gate:
    name: verify the tagged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Release artifacts are what operators run, so the artifact build is
      # itself part of the gate rather than something the build job discovers.
      - name: Release build
        run: cargo build --workspace --release

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Keyless signing below mints an ephemeral cosign key pair from the run's
      # OIDC identity, so the job must be able to request one.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: jnt-node
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: jnt-node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: jnt-node.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p jnt-node

      - name: Checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" | sed 's#  *#  #' > SHA256SUMS
          else
            # macOS ships shasum rather than sha256sum; the format is identical.
            shasum -a 256 "${{ matrix.artifact }}" | sed 's#  *#  #' > SHA256SUMS
          fi
          cat SHA256SUMS

      # Keyless signing (cosign/OIDC). No long-lived private key is stored in
      # the repo or its secrets: cosign mints an ephemeral key pair from the
      # GitHub OIDC identity and uploads the attestation to the Sigstore
      # transparency log. `mainnet-readiness.md` §7: operators verify against
      # the SHA256SUMS + the Sigstore bundle, not a Jounit-held signing key.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-version: '3.1.3'

      - name: Sign binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cosign sign-blob --bundle "${{ matrix.artifact }}.sig" \
            --yes "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jnt-node-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/SHA256SUMS
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sig
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release is the only write this job performs.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Assets
        shell: bash
        run: |
          {
            echo 'Release artifacts are signed keyless with cosign (OIDC identity)'
            echo 'from this GitHub Actions run — no long-lived signing key is stored'
            echo 'in the repository. See docs/mainnet-readiness.md §7.'
            echo
            echo 'Verification:'
            echo
            echo '  1. Fetch the binary and its .sig bundle for your platform from the'
            echo '     GitHub Release assets.'
            echo '  2. Verify the SHA-256 checksum:'
            echo '       sha256sum -c SHA256SUMS'
            echo '  3. Verify the sigstore bundle (cosign 2.x):'
            echo '       cosign verify-blob --bundle <binary>.sig <binary>'
            echo
            echo 'Checksums:'
            cat dist/SHA256SUMS
          } > dist/VERIFICATION.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/**
          fail_on_unmatched_files: true
          body_path: dist/VERIFICATION.txt
