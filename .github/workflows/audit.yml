name: Audit

# Weekly supply-chain check. Dependabot is capped at zero open PRs, so this
# scheduled job is the routine surface for advisory/audit findings.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Scheduled runs must not overlap: a slow install plus two checks could
# otherwise stack week over week.
concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      # Tool versions are pinned exact and installed locked. Both versions
      # below are stable releases older than 14 days at the time of pinning.
      # To bump: check crates.io for a stable release at least 14 days old,
      # update both `--version` flags here, and let the job prove the new
      # tools still pass on this lockfile.
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo audit
      - run: cargo deny check
