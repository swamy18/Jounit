[package]
name = "jnt-node"
description = "Jounit node CLI: genesis, mine, submit, validate, status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jnt-core.workspace = true
jnt-l2.workspace = true
jnt-net.workspace = true
jnt-store.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
# The worker SDK, so the end-to-end journey can drive the real worker client
# against the real node path (`tests/e2e_journey.rs`).
jnt-worker = { path = "../jnt-worker" }
