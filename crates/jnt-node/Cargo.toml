[package]
publish = false
name = "jnt-node"
description = "Jounit node CLI: init, mine, send, status, verify, serve and export, with an opt-in REST API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jnt-core.workspace = true
jnt-l2.workspace = true
jnt-net.workspace = true
jnt-store.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
subtle = "2.6"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
# Graceful shutdown: Ctrl-C/SIGTERM handler for `serve`.
ctrlc = "3.4"
# DoS guards on the service API: a per-request deadline, a cap on the number
# of requests admitted concurrently, and a per-IP rate limiter. §19.2 notes
# the API is non-consensus and opt-in; these keep it from being a
# self-inflicted DoS against the shared-state lock.
tower = { version = "0.5", features = ["limit", "timeout", "make", "util"] }

[dev-dependencies]
# The worker SDK, so the end-to-end journey can drive the real worker client
# against the real node path (`tests/e2e_journey.rs`).
jnt-worker = { path = "../jnt-worker" }
